name: Deploy

# Called by ci.yml after its checks pass on a push: develop -> staging, main -> production (wrangler.jsonc "env").
# A reusable workflow, not workflow_run: workflow_run only fires from files on the default branch (main).
on:
  workflow_call:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Environments hold the Cloudflare secrets and API URLs; add required reviewers on "production" to gate releases.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7 # the same commit CI just tested
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}
      - name: Deploy Worker (static assets)
        run: pnpm exec wrangler deploy --env "$WRANGLER_ENV" --message "${{ github.sha }}"
      # Smoke test: the deployed /status page must reach the API and its database.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:deployed
        env:
          DEPLOYED_URL: ${{ vars.FRONTEND_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployed-smoke-report
          path: test-results/
