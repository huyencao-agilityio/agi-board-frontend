name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are cancelled when superseded; a push run may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint reads every commit of the PR
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Branch name and commit messages follow the conventions
        if: github.event_name == 'pull_request'
        run: |
          sh scripts/check-branch-name.sh "${{ github.head_ref }}"
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:hooks
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # develop -> staging, main -> production; only after every check above passes.
  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit # Cloudflare secrets live in the staging/production GitHub Environments
